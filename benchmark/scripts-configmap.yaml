# Скрипты-помощники для джобов бенчмарка: замер времени сборки, получение
# IAM-токена и запись docker config. Монтируются в /scripts (defaultMode 0755).
# Рассчитаны на busybox/alpine (wget, sed, awk) — совместимы и с kaniko:debug,
# и с buildkit:rootless.
apiVersion: v1
kind: ConfigMap
metadata:
  name: benchmark-scripts
  namespace: kaniko-benchmark
  labels:
    app: kaniko-buildkit-benchmark
data:
  time-build.sh: |
    #!/bin/sh
    # Замеряет время выполнения команды сборки и пишет результат в /artifacts/times.txt.
    # Шаг в секундах (busybox date не умеет %N). Точность 1с для сборки достаточна.
    set -eu

    TOOL_NAME="${1:?tool name is required}"
    shift

    OUTDIR="${ARTIFACTS_DIR:-/artifacts}"
    mkdir -p "$OUTDIR"

    START="$(date +%s)"
    echo "=== $(date -u) START $TOOL_NAME ===" >> "$OUTDIR/times.txt"

    set +e
    "$@" > "$OUTDIR/build.log" 2>&1
    BUILD_RC=$?
    set -e

    END="$(date +%s)"
    echo "=== $(date -u) END $TOOL_NAME (rc=$BUILD_RC) ===" >> "$OUTDIR/times.txt"

    ELAPSED=$((END - START))
    echo "$TOOL_NAME elapsed_sec=$ELAPSED rc=$BUILD_RC" >> "$OUTDIR/times.txt"

    echo "BUILD_RC=$BUILD_RC"
    echo "ELAPSED_SEC=$ELAPSED"
    exit "$BUILD_RC"

  get-iam-token.sh: |
    #!/bin/sh
    # Печатает IAM-токен сервисного аккаунта ноды из метаданных Yandex Compute.
    # Извлекает "access_token" из JSON-ответа через sed (без python/jq).
    set -eu
    wget -q -O - \
      --header="Metadata-Flavor: Google" \
      "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token" \
      | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p'

  write-docker-config.sh: |
    #!/bin/sh
    # Пишет config.json для аутентификации в Yandex Container Registry.
    # Аргументы: <config-dir> <username> <password>
    set -eu
    DIR="${1:?dir is required}"
    USERNAME="${2:?username is required}"
    PASSWORD="${3:?password is required}"
    mkdir -p "$DIR"
    AUTH_B64=$(printf '%s:%s' "$USERNAME" "$PASSWORD" | base64 | tr -d '\n')
    cat > "$DIR/config.json" <<EOF
    {"auths":{"cr.yandex":{"auth":"$AUTH_B64"},"registry.yandex.cloud":{"auth":"$AUTH_B64"}}}
    EOF
    echo "docker config written to $DIR/config.json"