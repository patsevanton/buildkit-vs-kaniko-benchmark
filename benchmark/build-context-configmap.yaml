# Контекст сборки для kaniko (mount в /workspace). 
# Dockerfile + исходники приложения берутся из этого ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: build-context
  namespace: kaniko-benchmark
  labels:
    app: kaniko-buildkit-benchmark
data:
  Dockerfile: |
    # --- Kaniko vs BuildKit benchmark: одинаковый Dockerfile для обоих ---
    FROM debian:bookworm-slim AS builder

    RUN echo "deb http://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/base.list \
        && apt-get update \
        && apt-get install -y --no-install-recommends \
           ca-certificates curl git build-essential python3 python3-pip \
        && rm -rf /var/lib/apt/lists/*

    WORKDIR /src

    COPY . /src

    RUN pip3 install --no-cache-dir \
           --no-warn-script-location \
           flask==3.0.3 requests==2.32.3 gunicorn==23.0.0 \
        && chmod +x /src/app.sh

    FROM debian:bookworm-slim

    COPY --from=builder /usr/local/bin/python3 /usr/local/bin/
    COPY --from=builder /usr/local/lib/python3.11 /usr/local/lib/python3.11
    COPY --from=builder /usr/local/bin/gunicorn /usr/local/bin/
    COPY --from=builder /src/app.sh /app/app.sh

    RUN useradd -m app \
        && mkdir -p /app \
        && chown -R app:app /app

    USER app
    WORKDIR /app

    EXPOSE 8080
    CMD ["/bin/sh", "/app/app.sh"]
  app.py: |
    #!/usr/bin/env python3
    from flask import Flask

    app = Flask(__name__)

    @app.route("/")
    def hello():
        return "hello from kaniko-buildkit benchmark\n"

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8080)
  app.sh: |
    #!/bin/sh
    exec python3 /app/app.py