# Values для GitLab Runner (executor: kubernetes) на Managed Yandex K8s.
#
# Установка выполняется командой helm (см. README.md, раздел 1b):
#   helm upgrade --install gitlab-runner gitlab-runner/gitlab-runner \
#     --values gitlab-runner/values.yaml \
#     --set-string "runnerToken=<runner-token>"
#
# Раннер подключается к gitlab.com и запускает CI-джобы в namespace gitlab-runner
# того же кластера, где поднят стенд (ноды без публичных IP, исходящий трафик
# через NAT). Метрики CPU/RAM джобов снимает cAdvisor (vmks) — они попадают
# в VictoriaMetrics и видны в Grafana (dashboards/).

gitlabUrl: https://gitlab.com/

# Количество параллельно выполняемых джобов. Пара kaniko+buildkit одного
# проекта запускается одновременно (2 джоба), поэтому 2 достаточно.
concurrent: 2

# RBAC для создания/управления подами джобов.
rbac:
  create: true
  rules: []

serviceAccount:
  create: true

# Поды джобов создаются в том же namespace, что и сам раннер.
runners:
  executor: kubernetes
  # Тег, по которому джобы в .gitlab-ci.yml выбирают этот раннер.
  tags: "k8s-benchmark"
  # Раннер принимает только джобы с указанным тегом.
  runUntagged: false
  # Глобальный конфиг executor'а. Задаём лимиты build-контейнера
  # (те же 4 CPU / 4 GiB, что были у старых K8s-джобов бенчмарка).
  config: |
    [[runners]]
      [runners.kubernetes]
        namespace = "{{ .Release.Namespace }}"
        image = "alpine:3.20"
        cpu_request = "1"
        cpu_limit = "4"
        memory_request = "1Gi"
        memory_limit = "4Gi"
        helper_cpu_request = "100m"
        helper_cpu_limit = "500m"
        helper_memory_request = "128Mi"
        helper_memory_limit = "512Mi"
        # Build-контейнер работает от root (как kaniko, так и buildkit),
        # но без privileged — условия замеров уравнены с прежним стендом.
        privileged = false
        allow_privilege_escalation = true
        # Имена подов джобов не важны для Grafana: инструменты различаются
        # по label `image` метрик cAdvisor (…/kaniko… vs …/buildkit…).
        pull_policy = "if-not-present"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Пустой значения: секреты в репозиторий не коммитятся, токен передаётся
# командой helm через --set-string "runnerToken=<runner-token>".
